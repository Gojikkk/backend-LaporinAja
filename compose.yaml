services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laporinaja}
      POSTGRES_USER: ${POSTGRES_USER:-laporinaja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laporinaja_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-laporinaja}:${POSTGRES_PASSWORD:-laporinaja_dev}@db:5432/${POSTGRES_DB:-laporinaja}?schema=public
      PORT: 3000
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-session-secret-change-before-deploy}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_REQUEST_BYTES: ${MAX_UPLOAD_REQUEST_BYTES:-20971520}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploaded_files:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  uploaded_files:
